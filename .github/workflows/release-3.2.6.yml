name: Release v3.2.6
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'packaging/**'
      - 'README*'
      - 'CHANGELOG.md'
      - '.github/workflows/release-3.2.6.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-venv
      - name: Get appimagetool
        run: |
          curl -fL --retry 3 -o "$RUNNER_TEMP/appimagetool" https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"
      - name: Build packages
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          ./packaging/build-deb.sh
          APPIMAGETOOL="$RUNNER_TEMP/appimagetool" ./packaging/build-appimage.sh
          git archive --format=zip --output=dist/steamcommandgen_3.2.6.zip HEAD
          (cd dist && sha256sum SteamCommandGen-3.2.6-x86_64.AppImage SteamCommandGen_3.2.6_amd64.deb steamcommandgen_3.2.6.zip > SHA256SUMS)
      - name: Publish release and packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v3.2.6 >/dev/null 2>&1; then
            gh release upload v3.2.6 dist/* --clobber
            gh release edit v3.2.6 --title 'V3.2.6' --notes-file packaging/RELEASE_3.2.6.md
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/v3.2.6" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            gh release create v3.2.6 dist/* --target "$GITHUB_SHA" \
              --title 'V3.2.6' --notes-file packaging/RELEASE_3.2.6.md
          fi
