name: Release v3.2.6
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'packaging/**'
      - 'README*'
      - 'CHANGELOG.md'
      - '.github/workflows/release-3.2.6.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check release status
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v3.2.6 >/dev/null 2>&1; then
            echo 'already_exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'already_exists=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Install build dependencies
        if: steps.release.outputs.already_exists == 'false'
        run: sudo apt-get update && sudo apt-get install -y python3-venv
      - name: Get appimagetool
        if: steps.release.outputs.already_exists == 'false'
        run: |
          curl -fL --retry 3 -o "$RUNNER_TEMP/appimagetool" https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"
      - name: Build packages
        if: steps.release.outputs.already_exists == 'false'
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          ./packaging/build-deb.sh
          APPIMAGETOOL="$RUNNER_TEMP/appimagetool" ./packaging/build-appimage.sh
          git archive --format=zip --output=dist/steamcommandgen_3.2.6.zip HEAD
          sha256sum dist/* > dist/SHA256SUMS
      - name: Publish release and packages
        if: steps.release.outputs.already_exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v3.2.6 dist/* --target "$GITHUB_SHA" --title 'SteamCommandGen v3.2.6' --notes-file packaging/RELEASE_3.2.6.md
